name: Ark.com
description: 'Ark.com was a people search engine founded in San Francisco in March
  2012 by Patrick Riley and Yiming Liu, and part of Y Combinator''s Winter 2012 batch.
  Ark indexed over a billion public social network profiles — aggregating "ghost profiles"
  from Facebook, LinkedIn, AngelList and other networks — and let users search across
  them with filters such as hometown, current city, high school, college, employer
  and interests, to reconnect with classmates and acquaintances or find new business
  contacts. The company raised a $4.2M seed round in April 2012 from Andreessen Horowitz,
  Greylock Partners and SV Angel, and reached the finals of TechCrunch Disrupt NYC
  2012. Ark is no longer operating: Y Combinator lists the company as Inactive and
  PitchBook lists it as Out of Business. As of a July 2026 probe the ark.com domain
  no longer serves the company — it redirects to www.ark-invest.com, the unrelated
  ARK Investment Management site — and no api., developer. or docs. subdomain resolves.
  Ark never published a public API, developer portal or SDKs, so there is no API surface
  to catalog. Retained as a historical a16z portfolio record only.'
